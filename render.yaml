# Deploy Inkwell to Render (blueprint).
#
# In Render: New + > Blueprint, pick this repository, then fill in the
# SECRET_KEY prompt. The API and a managed PostgreSQL instance are created
# together and DATABASE_URL is wired up automatically.
#
# After it is live, set the repository variable INKWELL_API_URL to
# https://<api-service>.onrender.com/api so the Pages frontend points at it.

services:
  - type: web
    name: inkwell-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: inkwell-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://day24x7com.github.io
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: '1440'

databases:
  - name: inkwell-db
    plan: free
    databaseName: blogdb
    user: blog
