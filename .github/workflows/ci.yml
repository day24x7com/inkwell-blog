name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (lint + API smoke test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: blog
          POSTGRES_PASSWORD: blogpass
          POSTGRES_DB: blogdb
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U blog -d blogdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint
        working-directory: backend
        run: ruff check app seed.py scripts

      - name: Start API
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://blog:blogpass@127.0.0.1:5432/blogdb
          SECRET_KEY: ci-test-secret-key-not-for-production
          CORS_ORIGINS: http://localhost:4200
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/api/health && break
            sleep 1
          done

      - name: Exercise the API
        run: python -m scripts.smoke_test
        env:
          API_URL: http://127.0.0.1:8000/api

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build -- --configuration production
